<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc"><title id="title">From prompt templates to a reviewed dataset</title><desc id="desc">Generation is followed by deduplication and automated label checks. Disagreements go through human review before dataset assembly.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#384c70"/></marker></defs><rect width="100%" height="100%" fill="#f9f7f2"/><g font-family="Georgia, serif" fill="#282824"><text x="500" y="55" text-anchor="middle" font-size="32" fill="#282824">From prompts to a reviewed dataset</text><rect x="170" y="100" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="138" text-anchor="middle" font-size="26" fill="#282824">Prompt templates</text><text x="500.0" y="168" text-anchor="middle" font-size="21" fill="#55534e">Separate safe and unsafe contexts</text><path d="M500 190L500 235" stroke="#384c70" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="170" y="245" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="283" text-anchor="middle" font-size="26" fill="#282824">Generate examples</text><text x="500.0" y="313" text-anchor="middle" font-size="21" fill="#55534e">Initial prompts and labels</text><path d="M500 335L500 380" stroke="#384c70" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="170" y="390" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="428" text-anchor="middle" font-size="26" fill="#282824">Semantic deduplication</text><text x="500.0" y="458" text-anchor="middle" font-size="21" fill="#55534e">Remove near-duplicate prompts</text><path d="M500 480L500 525" stroke="#384c70" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="170" y="535" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="573" text-anchor="middle" font-size="26" fill="#282824">G-Eval label checks</text><text x="500.0" y="603" text-anchor="middle" font-size="21" fill="#55534e">Compare the evaluator with the initial label</text><path d="M500 625L500 665" stroke="#384c70" stroke-width="2" marker-end="url(#arrow)" fill="none"/><path d="M500 665H260V735 M500 665H740V735" stroke="#384c70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="687" width="270" height="34" fill="#f9f7f2"/><rect x="595" y="687" width="290" height="34" fill="#f9f7f2"/><text x="260" y="713" text-anchor="middle" font-size="23" fill="#282824">Labels agree</text><text x="740" y="713" text-anchor="middle" font-size="23" fill="#282824">Labels disagree</text><rect x="80" y="750" width="360" height="95" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="260.0" y="788" text-anchor="middle" font-size="26" fill="#282824">Keep original label</text><text x="260.0" y="818" text-anchor="middle" font-size="21" fill="#55534e">Automated agreement</text><rect x="560" y="750" width="360" height="95" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="740.0" y="788" text-anchor="middle" font-size="26" fill="#282824">Human review</text><text x="740.0" y="818" text-anchor="middle" font-size="21" fill="#55534e">Inspect and correct labels</text><path d="M260 845V900H500 M740 845V900H500V940" stroke="#384c70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="170" y="950" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="988" text-anchor="middle" font-size="26" fill="#282824">Dataset assembly</text><text x="500.0" y="1018" text-anchor="middle" font-size="21" fill="#55534e">Combine examples for training and evaluation</text></g></svg>