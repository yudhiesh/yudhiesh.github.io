<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">Checks around a model call</title><desc id="desc">Input and output checks may send a request or response to review rather than pass it onward.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#384c70"/></marker></defs><rect width="100%" height="100%" fill="#f9f7f2"/><g font-family="Georgia, serif" fill="#282824"><text x="500" y="55" text-anchor="middle" font-size="32" fill="#282824">Checks around a model call</text><rect x="170" y="95" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="133" text-anchor="middle" font-size="26" fill="#282824">Request</text><text x="500.0" y="163" text-anchor="middle" font-size="21" fill="#55534e">A prompt from the user</text><path d="M500 185L500 230" stroke="#384c70" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="170" y="235" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="273" text-anchor="middle" font-size="26" fill="#282824">Input check</text><text x="500.0" y="303" text-anchor="middle" font-size="21" fill="#55534e">Does this request fit the policy?</text><path d="M500 325L500 370" stroke="#384c70" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="170" y="375" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="413" text-anchor="middle" font-size="26" fill="#282824">Main LLM</text><text x="500.0" y="443" text-anchor="middle" font-size="21" fill="#55534e">Generate a response</text><path d="M500 465L500 510" stroke="#384c70" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="170" y="515" width="660" height="90" rx="6" fill="#efede6" stroke="#bcc2cd"/><text x="500.0" y="553" text-anchor="middle" font-size="26" fill="#282824">Output check</text><text x="500.0" y="583" text-anchor="middle" font-size="21" fill="#55534e">Does this response meet the requirements?</text><path d="M500 605L500 656" stroke="#384c70" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="500" y="694" text-anchor="middle" font-size="27" fill="#282824">Response returned to the user</text><text x="500" y="755" text-anchor="middle" font-size="23" fill="#55534e">A failed check can block or route to review.</text></g></svg>